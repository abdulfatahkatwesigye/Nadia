<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>reasons, for nadia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6f0;
    --blush:#f9d9d2;
    --rose:#e78a95;
    --deep-rose:#c65f74;
    --gold:#e3a857;
    --ink:#4a3540;
    --muted:#a88a90;
    --night:#241a2e;
    --night-deep:#150f1c;
    --star:#ffe9c7;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;height:100%;width:100%;}
  h1,h2{font-family:'Space Grotesk',sans-serif;font-weight:300;}
  .screen{position:fixed;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity 0.7s ease;}
  .screen.active{opacity:1;pointer-events:auto;}
  .scrollable{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .fixed-ui{position:fixed;z-index:50;}
  .back-btn{position:fixed;top:18px;left:18px;z-index:60;background:rgba(255,255,255,0.65);border:1px solid rgba(198,95,116,0.25);color:var(--deep-rose);font-family:'Inter';font-size:12px;letter-spacing:0.06em;padding:10px 16px;border-radius:30px;cursor:pointer;backdrop-filter:blur(6px);transition:all 0.3s;min-height:40px;}
  .back-btn.on-dark{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:var(--star);}
  .back-btn:hover{transform:translateX(-2px);}
  .hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-align:center;z-index:40;background:rgba(255,255,255,0.5);padding:6px 14px;border-radius:20px;backdrop-filter:blur(4px);}
  .hint.on-dark{color:#c9b8d4;background:rgba(255,255,255,0.06);}

  /* START SCREEN */
  #start-screen{background:linear-gradient(160deg,var(--cream),var(--blush));}
  #petals{position:absolute;inset:0;z-index:0;}
  .start-inner{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 16px;}
  .start-title{font-size:clamp(24px,4.2vw,36px);font-weight:300;color:var(--deep-rose);margin-bottom:8px;text-align:center;}
  .start-sub{font-size:13px;color:var(--muted);letter-spacing:0.06em;margin-bottom:44px;text-align:center;}
  .btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;width:100%;max-width:520px;}
  .opt-btn{position:relative;background:rgba(255,255,255,0.6);border:1px solid rgba(198,95,116,0.2);border-radius:16px;padding:20px 16px;cursor:pointer;overflow:hidden;transition:transform 0.3s ease, border-color 0.3s, background 0.3s;text-align:left;box-shadow:0 6px 20px rgba(198,95,116,0.08);}
  .opt-btn:hover{transform:translateY(-3px);border-color:var(--rose);background:#fff;}
  .opt-btn:active{transform:scale(0.98);}
  .opt-icon{width:100%;height:56px;margin-bottom:12px;}
  .opt-label{font-family:'Space Grotesk';font-size:14.5px;color:var(--ink);}
  .opt-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .icon-canvas{width:100%;height:100%;}

  /* ENVELOPE WALL */
  #env-section{background:var(--cream);}
  .env-inner{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:80px 16px 70px;}
  .env-title{font-size:13px;color:var(--muted);letter-spacing:0.14em;margin-bottom:28px;text-transform:uppercase;text-align:center;}
  .env-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;width:100%;max-width:560px;}
  .envelope{background:#fff;border:1px solid var(--blush);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(198,95,116,0.1);transition:box-shadow 0.3s;}
  .envelope:active{transform:scale(0.98);}
  .env-head{padding:16px 10px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:0.04em;position:relative;transition:color 0.3s;}
  .env-head::before{content:'✉';display:block;font-size:16px;color:var(--rose);margin-bottom:6px;}
  .envelope.open .env-head{color:var(--deep-rose);}
  .env-paper{max-height:0;opacity:0;overflow:hidden;transition:max-height 0.45s ease, opacity 0.35s ease, padding 0.45s ease;font-size:12.5px;line-height:1.6;color:var(--ink);text-align:center;word-wrap:break-word;}
  .envelope.open .env-paper{max-height:260px;opacity:1;padding:0 14px 16px;}

  /* HEARTBEAT METER */
  #heart-section{background:linear-gradient(160deg,#fff0ec,var(--blush));}
  .heart-inner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 20px 70px;text-align:center;}
  #heart-svg{width:130px;height:130px;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(231,138,149,0.4));}
  .heart-text{max-width:420px;font-size:15.5px;color:var(--ink);margin-top:24px;min-height:50px;padding:0 6px;line-height:1.6;opacity:0;transition:opacity 0.5s;}
  .heart-text.show{opacity:1;}
  .heart-btn{margin-top:24px;background:var(--deep-rose);color:#fff;border:none;padding:13px 26px;border-radius:30px;font-size:13px;letter-spacing:0.05em;cursor:pointer;font-family:'Inter';transition:transform 0.2s, background 0.3s;}
  .heart-btn:hover{transform:scale(1.05);background:#b34f63;}
  .heart-btn:disabled{opacity:0.55;transform:none;}
  .heart-count{font-size:11px;color:var(--muted);margin-top:14px;letter-spacing:0.06em;}

  /* PAPER AIRPLANES */
  #plane-section{background:linear-gradient(180deg,#fdf0e6,var(--cream));}
  #plane-canvas{position:absolute;inset:0;width:100%;height:100%;}
  .plane-tray{position:absolute;bottom:0;left:0;width:100%;padding:16px 14px 60px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;z-index:3;max-height:42%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .caught-note{background:#fff;border:1px solid var(--blush);border-radius:10px;padding:9px 13px;font-size:11.5px;color:var(--ink);max-width:170px;box-shadow:0 3px 10px rgba(198,95,116,0.1);animation:popin 0.4s ease;}
  @keyframes popin{from{opacity:0;transform:translateY(10px) scale(0.9);}to{opacity:1;transform:translateY(0) scale(1);}}

  /* CONSTELLATION */
  #star-section{background:radial-gradient(ellipse at 50% 30%,var(--night),var(--night-deep));}
  #star-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;}
  .star-msg{position:fixed;top:64px;left:50%;transform:translateX(-50%);text-align:center;font-size:11.5px;color:#c9b8d4;letter-spacing:0.08em;max-width:85%;z-index:45;pointer-events:none;transition:opacity 0.4s;padding:0 10px;line-height:1.6;}

  @media (max-width:480px){
    .btn-grid{grid-template-columns:1fr;max-width:280px;}
    .env-grid{grid-template-columns:repeat(2,1fr);}
    .env-inner{padding-top:70px;}
    .heart-inner{padding-top:70px;}
    #heart-svg{width:110px;height:110px;}
    .heart-text{font-size:14px;}
    .start-inner{padding-top:50px;}
    .env-head::before{font-size:14px;}
    .env-paper{font-size:12px;}
  }
  @media (max-height:560px){
    .heart-inner, .env-inner, .start-inner{padding-top:60px;padding-bottom:50px;}
  }
</style>
</head>
<body>

<section id="start-screen" class="screen active scrollable">
  <canvas id="petals"></canvas>
  <div class="start-inner">
    <div class="start-title">for nadia</div>
    <div class="start-sub">a few reasons, waiting to be opened</div>
    <div class="btn-grid">
      <div class="opt-btn" data-target="env-section">
        <div class="opt-icon"><canvas class="icon-canvas" id="icon-env"></canvas></div>
        <div class="opt-label">the envelopes</div>
        <div class="opt-desc">open one to find a reason</div>
      </div>
      <div class="opt-btn" data-target="heart-section">
        <div class="opt-icon"><canvas class="icon-canvas" id="icon-heart"></canvas></div>
        <div class="opt-label">the heartbeat</div>
        <div class="opt-desc">tap, and watch it grow warmer</div>
      </div>
      <div class="opt-btn" data-target="plane-section">
        <div class="opt-icon"><canvas class="icon-canvas" id="icon-plane"></canvas></div>
        <div class="opt-label">the paper planes</div>
        <div class="opt-desc">catch one before it drifts off</div>
      </div>
      <div class="opt-btn" data-target="star-section">
        <div class="opt-icon"><canvas class="icon-canvas" id="icon-star"></canvas></div>
        <div class="opt-label">the constellation</div>
        <div class="opt-desc">connect the stars, one by one</div>
      </div>
    </div>
  </div>
</section>

<section id="env-section" class="screen scrollable">
  <button class="back-btn" data-back>← back</button>
  <div class="env-inner">
    <div class="env-title">tap one open</div>
    <div class="env-grid" id="env-grid"></div>
  </div>
</section>

<section id="heart-section" class="screen scrollable">
  <button class="back-btn" data-back>← back</button>
  <div class="heart-inner">
    <svg id="heart-svg" viewBox="0 0 100 100">
      <path id="heart-path" d="M50,88 C20,65 4,45 4,28 C4,12 17,2 30,2 C40,2 47,8 50,16 C53,8 60,2 70,2 C83,2 96,12 96,28 C96,45 80,65 50,88 Z" fill="#e78a95"/>
    </svg>
    <div class="heart-text" id="heart-text"></div>
    <button class="heart-btn" id="heart-btn">another reason</button>
    <div class="heart-count" id="heart-count"></div>
  </div>
</section>

<section id="plane-section" class="screen">
  <button class="back-btn" data-back>← back</button>
  <canvas id="plane-canvas"></canvas>
  <div class="plane-tray" id="plane-tray"></div>
  <div class="hint">tap a plane to catch it</div>
</section>

<section id="star-section" class="screen">
  <button class="back-btn on-dark" data-back>← back</button>
  <div class="star-msg" id="star-msg">tap a star</div>
  <canvas id="star-canvas"></canvas>
</section>

<script>
const REASONS = [
  "the way you laugh at your own jokes before you even finish telling them",
  "how you make ordinary days feel like something worth remembering",
  "the way your eyes light up when you talk about things you love",
  "how safe and calm i feel just being near you",
  "your kindness toward people who can't do anything for you in return",
  "the way you say my name, specifically",
  "how you always seem to know exactly what to say",
  "the silly side of you that almost no one else gets to see",
  "how you make me want to be a better person, without even trying",
  "the little things you do without ever being asked to",
  "how you stayed, even on the harder days",
  "simply. you. that's the whole reason",
  "the way you get excited over small, good things",
  "how you remember details i didn't think mattered to anyone",
  "the way you make a room feel warmer just by being in it"
];
function shuffled(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{ s.classList.remove('active'); s.scrollTop = 0; });
  const el = document.getElementById(id);
  el.classList.add('active');
  el.scrollTop = 0;
  window.dispatchEvent(new Event('resize'));
}
document.querySelectorAll('.opt-btn').forEach(b=>{
  b.addEventListener('click', ()=> showScreen(b.dataset.target));
});
document.querySelectorAll('[data-back]').forEach(b=>{
  b.addEventListener('click', ()=> showScreen('start-screen'));
});
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>window.dispatchEvent(new Event('resize')), 200); });

/* START SCREEN PETALS */
(function(){
  const canvas = document.getElementById('petals');
  const ctx = canvas.getContext('2d');
  let petals=[];
  function resize(){
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    petals = Array.from({length:22},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:3+Math.random()*4,s:0.3+Math.random()*0.5,drift:Math.random()*2-1,rot:Math.random()*360,rs:(Math.random()-0.5)*2}));
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    petals.forEach(p=>{
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle='rgba(231,138,149,0.3)';
      ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*0.6,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      p.y+=p.s; p.x+=Math.sin(p.y*0.01)*p.drift*0.3; p.rot+=p.rs;
      if(p.y>canvas.height){ p.y=-8; p.x=Math.random()*canvas.width; }
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();

function iconLoop(id, drawFn){
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  function resize(){ c.width=c.offsetWidth*2; c.height=c.offsetHeight*2; ctx.setTransform(2,0,0,2,0,0); }
  resize();
  let t=0;
  function loop(){ drawFn(ctx,c.offsetWidth,c.offsetHeight,t); t++; requestAnimationFrame(loop); }
  loop();
}
iconLoop('icon-env',(ctx,w,h,t)=>{
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2, ew=40, eh=26;
  const flap = (Math.sin(t*0.03)+1)/2;
  ctx.fillStyle='#f9d9d2'; ctx.fillRect(cx-ew/2,cy-eh/2,ew,eh);
  ctx.strokeStyle='#e78a95'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx-ew/2,cy-eh/2); ctx.lineTo(cx,cy-eh/2-8-flap*6); ctx.lineTo(cx+ew/2,cy-eh/2); ctx.stroke();
});
iconLoop('icon-heart',(ctx,w,h,t)=>{
  ctx.clearRect(0,0,w,h);
  const s = 1 + Math.sin(t*0.06)*0.08;
  ctx.save(); ctx.translate(w/2,h/2); ctx.scale(s,s);
  ctx.fillStyle='#e78a95'; ctx.beginPath();
  ctx.moveTo(0,10);
  ctx.bezierCurveTo(-16,-4,-16,-16,-6,-16);
  ctx.bezierCurveTo(0,-16,0,-10,0,-8);
  ctx.bezierCurveTo(0,-10,0,-16,6,-16);
  ctx.bezierCurveTo(16,-16,16,-4,0,10);
  ctx.fill(); ctx.restore();
});
iconLoop('icon-plane',(ctx,w,h,t)=>{
  ctx.clearRect(0,0,w,h);
  const x = (t*0.8)%(w+30)-15, y = h/2 + Math.sin(t*0.05)*10;
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*0.05)*0.2);
  ctx.fillStyle='#c65f74'; ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(-18,6); ctx.lineTo(-14,0); ctx.lineTo(-18,-6); ctx.closePath(); ctx.fill();
  ctx.restore();
});
iconLoop('icon-star',(ctx,w,h,t)=>{
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#241a2e'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<10;i++){
    const x = (i*37+13)%w, y=(i*23+7)%h;
    const a = 0.4+Math.sin(t*0.05+i)*0.4;
    ctx.fillStyle='rgba(255,233,199,'+Math.max(0.1,a)+')';
    ctx.beginPath(); ctx.arc(x,y,1.4,0,Math.PI*2); ctx.fill();
  }
});

/* ENVELOPE WALL */
(function(){
  const grid = document.getElementById('env-grid');
  const set = shuffled(REASONS).slice(0,6);
  const labels = ["your laugh","tuesdays","that one text","your hands","how you listen","just because"];
  set.forEach((reason,i)=>{
    const env = document.createElement('div');
    env.className='envelope';
    env.innerHTML = `<div class="env-head">${labels[i%labels.length]}</div><div class="env-paper">${reason}</div>`;
    env.addEventListener('click', ()=> env.classList.toggle('open'));
    grid.appendChild(env);
  });
})();

/* HEARTBEAT METER */
(function(){
  const set = shuffled(REASONS);
  let idx = -1;
  const svg = document.getElementById('heart-svg');
  const path = document.getElementById('heart-path');
  const text = document.getElementById('heart-text');
  const btn = document.getElementById('heart-btn');
  const count = document.getElementById('heart-count');
  function pulse(){
    const beat = Math.min(1.28, 1 + (idx+1)*0.02 + 0.06);
    svg.animate([{transform:'scale(1)'},{transform:`scale(${beat})`},{transform:'scale(1)'}],{duration:520,easing:'ease-in-out'});
  }
  btn.addEventListener('click', ()=>{
    idx = (idx+1) % set.length;
    text.classList.remove('show');
    setTimeout(()=>{ text.textContent = set[idx]; text.classList.add('show'); }, 200);
    pulse();
    const warmth = Math.min(1, (idx+1)/set.length);
    const r = 231 + warmth*20, g = 138 - warmth*20, b = 149 - warmth*40;
    path.setAttribute('fill', `rgb(${r},${g},${b})`);
    count.textContent = (idx+1) + ' of ' + set.length + ' reasons';
    if(idx === set.length-1){ btn.textContent = "that's all of them (for now)"; btn.disabled=true; }
  });
  setInterval(()=>{ if(idx<0){ svg.animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:900,easing:'ease-in-out'}); } }, 1400);
})();

/* PAPER AIRPLANES */
(function(){
  const canvas = document.getElementById('plane-canvas');
  const ctx = canvas.getContext('2d');
  const section = document.getElementById('plane-section');
  const tray = document.getElementById('plane-tray');
  const pool = shuffled(REASONS);
  let poolIdx = 0;
  let planes = [];
  function spawnPlane(){
    if(poolIdx >= pool.length) return;
    planes.push({
      x:-40, y: 60+Math.random()*(canvas.height*0.45),
      speed: 0.6+Math.random()*0.5, amp: 15+Math.random()*15, freq: 0.01+Math.random()*0.01,
      phase: Math.random()*10, reason: pool[poolIdx++], caught:false
    });
  }
  function resize(){ canvas.width=section.offsetWidth; canvas.height=section.offsetHeight; }
  let t=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    planes.forEach(p=>{
      if(p.caught) return;
      p.x += p.speed;
      const y = p.y + Math.sin(t*p.freq+p.phase)*p.amp;
      p.drawY = y;
      ctx.save(); ctx.translate(p.x,y); ctx.rotate(Math.sin(t*p.freq+p.phase)*0.15);
      ctx.fillStyle='#c65f74'; ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(-26,9); ctx.lineTo(-20,0); ctx.lineTo(-26,-9); ctx.closePath(); ctx.fill();
      ctx.restore();
    });
    planes = planes.filter(p=> p.caught || p.x < canvas.width+40);
    if(Math.random()<0.01 && planes.filter(p=>!p.caught).length<3) spawnPlane();
    t++; requestAnimationFrame(draw);
  }
  canvas.addEventListener('click', e=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    let closest=null, cd=Infinity;
    planes.forEach(p=>{ if(p.caught) return; const d = Math.hypot(mx-p.x, my-(p.drawY||p.y)); if(d<cd){cd=d;closest=p;} });
    if(closest && cd<50){
      closest.caught = true;
      const note = document.createElement('div');
      note.className='caught-note';
      note.textContent = closest.reason;
      tray.appendChild(note);
    }
  });
  window.addEventListener('resize', resize);
  resize(); spawnPlane(); spawnPlane(); draw();
})();

/* CONSTELLATION */
(function(){
  const canvas = document.getElementById('star-canvas');
  const ctx = canvas.getContext('2d');
  const section = document.getElementById('star-section');
  const msg = document.getElementById('star-msg');
  const set = shuffled(REASONS).slice(0,10);
  let stars = [];
  let opened = [];
  let bgStars = [];
  function layout(){
    stars = [];
    const cx = canvas.width/2, cy = canvas.height/2;
    const n = set.length;
    for(let i=0;i<n;i++){
      const angle = (i/n)*Math.PI*2;
      const r = Math.min(canvas.width,canvas.height)*0.3 * (0.6+Math.random()*0.5);
      stars.push({ x: cx+Math.cos(angle)*r + (Math.random()*40-20), y: cy+Math.sin(angle)*r*0.7 + (Math.random()*40-20), reason: set[i], done:false, tw: Math.random()*10 });
    }
    bgStars = Array.from({length:70},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:0.6+Math.random()*1,tw:Math.random()*10}));
  }
  function resize(){ canvas.width=section.offsetWidth; canvas.height=section.offsetHeight; layout(); opened=[]; }
  let t=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    bgStars.forEach(s=>{ const a=0.3+Math.sin(t*0.03+s.tw)*0.3; ctx.fillStyle='rgba(255,255,255,'+Math.max(0.05,a)+')'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); });
    ctx.strokeStyle='rgba(255,233,199,0.5)'; ctx.lineWidth=1;
    for(let i=1;i<opened.length;i++){
      ctx.beginPath(); ctx.moveTo(opened[i-1].x,opened[i-1].y); ctx.lineTo(opened[i].x,opened[i].y); ctx.stroke();
    }
    stars.forEach(s=>{
      const a = s.done ? 1 : 0.55+Math.sin(t*0.05+s.tw)*0.25;
      ctx.fillStyle = s.done ? '#ffe9c7' : 'rgba(255,233,199,'+a+')';
      ctx.shadowColor = '#ffe9c7'; ctx.shadowBlur = s.done ? 12 : 4;
      ctx.beginPath(); ctx.arc(s.x,s.y, s.done?4:2.6, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    });
    t++; requestAnimationFrame(draw);
  }
  canvas.addEventListener('click', e=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    let closest=null, cd=Infinity;
    stars.forEach(s=>{ const d=Math.hypot(mx-s.x,my-s.y); if(d<cd){cd=d;closest=s;} });
    if(closest && cd<40 && !closest.done){
      closest.done = true; opened.push(closest);
      msg.style.opacity=0;
      setTimeout(()=>{ msg.textContent = closest.reason; msg.style.opacity=1; }, 200);
      if(opened.length===stars.length){ setTimeout(()=>{ msg.style.opacity=0; setTimeout(()=>{ msg.textContent="every star, connected. like that."; msg.style.opacity=1; },300); }, 2200); }
    }
  });
  window.addEventListener('resize', resize);
  resize(); draw();
})();
</script>
